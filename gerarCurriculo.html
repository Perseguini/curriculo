<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo</title>
    <link rel="stylesheet" href="css/modelo.css">
    <style>
        .barra-acoes {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #f1f1f1;
        }
        .barra-acoes button, .barra-acoes a {
            cursor: pointer;
            padding: 6px 14px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
        }
        #mensagem-vazia {
            padding: 40px;
            text-align: center;
            font-family: 'Lato', sans-serif;
        }
        @media print {
            .barra-acoes { display: none; }
        }
    </style>
</head>
<body>

    <div class="barra-acoes">
        <a href="curriculo.html">&larr; Voltar e editar</a>
        <button id="btn-imprimir">Imprimir / Salvar PDF</button>
    </div>

    <div id="mensagem-vazia" style="display:none">
        <p>Nenhum dado de currículo encontrado.</p>
        <p><a href="curriculo.html">Clique aqui para preencher o formulário</a>.</p>
    </div>

    <main id="curriculo-conteudo" style="display:none">
        <section class="lateral">
            <img id="c-foto" src="" alt="Foto" class="foto">
            <h1 id="c-nome"></h1>
            <h3 id="c-telefone-lateral"></h3>
        </section>
        <section class="principal">
            <h2>Objetivo</h2>
            <p id="c-objetivo"></p>

            <div id="c-bloco-formacoes" style="width:100%; display:none">
                <h2>Formação</h2>
                <ul class="lista-topicos" id="c-lista-formacoes"></ul>
            </div>

            <div id="c-bloco-experiencias" style="width:100%; display:none">
                <h2>Experiência</h2>
                <ul class="lista-topicos" id="c-lista-experiencias"></ul>
            </div>

            <h2>Contato</h2>
            <ul class="lista-topicos">
                <li>
                    <div>
                        <h4>Endereço:</h4>
                        <p id="c-endereco"></p>
                    </div>
                </li>
                <li>
                    <div>
                        <div>
                            <h4>Telefone:</h4>
                            <p id="c-telefone"></p>
                        </div>
                    </div>
                </li>
                <li>
                    <div>
                        <div>
                            <h4>Email:</h4>
                            <p id="c-email"></p>
                        </div>
                    </div>
                </li>
                <li>
                    <div>
                        <div>
                            <h4>Data de Nascimento:</h4>
                            <p id="c-data"></p>
                        </div>
                    </div>
                </li>
            </ul>
        </section>
    </main>

    <script>
        function criarItem(titulo, linha1, linha2) {
            var li = document.createElement("li");
            var div = document.createElement("div");

            var h4 = document.createElement("h4");
            h4.textContent = titulo;
            div.appendChild(h4);

            var p1 = document.createElement("p");
            p1.textContent = linha1;
            div.appendChild(p1);

            if (linha2 !== undefined) {
                var p2 = document.createElement("p");
                p2.textContent = linha2;
                div.appendChild(p2);
            }

            li.appendChild(div);
            return li;
        }

        function carregarCurriculo() {
            var dadosBrutos = localStorage.getItem("dadosCurriculo");

            if (!dadosBrutos) {
                document.getElementById("mensagem-vazia").style.display = "block";
                return;
            }

            var dados;
            try {
                dados = JSON.parse(dadosBrutos);
            } catch (erro) {
                document.getElementById("mensagem-vazia").style.display = "block";
                return;
            }

            document.getElementById("curriculo-conteudo").style.display = "flex";

            document.getElementById("c-foto").src = dados.foto || "img/avatar-1.png";
            document.getElementById("c-nome").textContent = dados.nome || "";
            document.getElementById("c-telefone-lateral").textContent = dados.telefone || "";
            document.getElementById("c-objetivo").textContent = dados.objetivo || "";
            document.getElementById("c-endereco").textContent = dados.endereco || "";
            document.getElementById("c-telefone").textContent = dados.telefone || "";
            document.getElementById("c-email").textContent = dados.email || "";
            document.getElementById("c-data").textContent = dados.data || "";

            if (dados.formacoes && dados.formacoes.cursos && dados.formacoes.cursos.length > 0) {
                var listaFormacoes = document.getElementById("c-lista-formacoes");
                for (var i = 0; i < dados.formacoes.cursos.length; i++) {
                    listaFormacoes.appendChild(criarItem(
                        dados.formacoes.cursos[i],
                        dados.formacoes.instituicoes[i],
                        dados.formacoes.conclusoes[i]
                    ));
                }
                document.getElementById("c-bloco-formacoes").style.display = "block";
            }

            if (dados.experiencias && dados.experiencias.cargos && dados.experiencias.cargos.length > 0) {
                var listaExperiencias = document.getElementById("c-lista-experiencias");
                for (var j = 0; j < dados.experiencias.cargos.length; j++) {
                    listaExperiencias.appendChild(criarItem(
                        dados.experiencias.cargos[j],
                        dados.experiencias.empresas[j],
                        dados.experiencias.inicios[j] + " a " + dados.experiencias.fins[j]
                    ));
                }
                document.getElementById("c-bloco-experiencias").style.display = "block";
            }
        }

        document.getElementById("btn-imprimir").addEventListener("click", function () {
            window.print();
        });

        carregarCurriculo();
    </script>
</body>
</html>
